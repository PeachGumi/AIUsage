name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
      - name: Verify Xcode project contains every Swift file
        shell: bash
        run: |
          set -euo pipefail
          project='AIUsage.xcodeproj/project.pbxproj'
          missing=0
          while IFS= read -r file; do
            name="$(basename "$file")"
            count="$(grep -F -c "$name in Sources" "$project" || true)"
            if [ "$count" -lt 2 ]; then
              echo "::error file=$file::Swift file is not registered in the Xcode project's Sources build phase"
              missing=1
            fi
          done < <(find Sources Tests -type f -name '*.swift' -print | sort)
          exit "$missing"
      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project AIUsage.xcodeproj \
            -scheme AIUsage \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
      - name: Release build
        run: |
          set -o pipefail
          xcodebuild build \
            -project AIUsage.xcodeproj \
            -scheme AIUsage \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
